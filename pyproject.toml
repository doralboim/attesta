[project]
name = "attesta"
version = "0.2.0"
description = "Provenance-grade EU property data and signed verification for AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastmcp>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=11.0.0",
    "litellm>=1.60.0",
    "structlog>=24.4.0",
    "boto3>=1.35.0",
    "pgvector>=0.3.6",
    "greenlet>=3.1.0",
]

[project.optional-dependencies]
x402 = ["x402[fastapi,evm]>=2.13.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "httpx>=0.28.0",
    "types-python-jose>=3.3.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
attesta-api = "app.main:cli"
attesta-ingest = "app.workers.ingest_worker:cli"
attesta-resolve = "app.workers.resolve_worker:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = ["fastmcp.*", "x402.*", "boto3.*", "botocore.*", "pgvector.*", "jose.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]
